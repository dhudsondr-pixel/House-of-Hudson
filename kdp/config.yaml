# =============================================================================
# House of Hudson — KDP Auto-Publishing
# =============================================================================
# Edit this file to control what books get generated.
# No code knowledge required — just change values inside the quotes.
# =============================================================================

# Broad theme. Drives the niche brainstorm and listing copy. Be SPECIFIC.
theme: "adult ADHD daily planning and symptom management for newly-diagnosed and undiagnosed-for-decades adults — executive function support, medication tracking, hyperfocus harnessing, real-world life management"

# Which book formats to generate. Pick 1+. Each format becomes one or more books.
# Options: lined, prompt_journal, tracker, wordsearch, diabetes_log, adhd_planner
book_types:
  - adhd_planner
  - adhd_planner
  - adhd_planner

# How many books per book_type per run. Start at 1; the line above generates
# 2 trackers + 1 lined per run because we listed "tracker" twice.
books_per_type: 1

# Trim size. "6x9" is portable, fits in a bag, dominant on Amazon.
# "8.5x11" works better if the tracker grid needs more columns (e.g., 31-day
# views) — consider switching to 8.5x11 for symptom-heavy trackers.
# Options: "6x9", "5x8", "8.5x11", "7x10"
trim: "6x9"

# Paper. "white" is cheaper to print (higher royalty). "cream" feels nicer
# for journals; for medical trackers "white" is more appropriate.
paper: "white"

# Interior page count. 90-120 pages is right for a 3-month tracker.
# 150-180 for a 6-month tracker. Higher count = higher print cost.
page_count: 100

# Author byline that appears on the title page. KDP listing also has a
# separate "Publisher" field — set that to "Hudson Health Press" when you
# upload each book on KDP's website.
author_name: "Dr. D. Hudson"

# List price (USD). Medical tracker books support a higher price than
# generic journals because buyers (patients + caregivers) value perceived
# clinical authority. $8.99-12.99 is the right band.
list_price: 9.99

# Avoid regenerating niches we've already done.
avoid_repeats: true
