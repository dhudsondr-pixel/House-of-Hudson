# =============================================================================
# House of Hudson — Social Media Content Factory (3D printing brand)
# =============================================================================
# Edit this once for your brand. The same config drives every daily run.
# =============================================================================

# Your brand name (appears as the brand mark on every post).
brand_name: "House of Hudson"

# What you do, in specific 3D-printing language.
niche: "original STL designs and custom 3D printing for makers and gift-givers"

# Who you're talking to. Be specific.
audience: "DIY makers and hobbyist printers (Bambu / Prusa / Ender owners), plus non-printer gift-buyers searching Etsy for printed items"

# Your tagline (small text on each post).
tagline: "Printed in-house. Designed to keep."

# Where you want clicks to go. Some good options for a 3D printing brand:
#   - Your Cults3D profile:     https://cults3d.com/en/users/<your-handle>
#   - Your MakerWorld profile:  https://makerworld.com/en/@<your-handle>
#   - Your Printables profile:  https://www.printables.com/@<your-handle>
#   - Your Etsy shop:           https://www.etsy.com/shop/<your-shop>
#   - A Linktree with all of the above
link_in_bio: "https://linktr.ee/houseofhudson"

# Featured design / focus for today's posts. Two ways to set this:
#
# 1) Auto-pick from a recent STL listing folder (set featured_design_dir to a
#    path like "stl/output/2026-05-25/desktop_organizer").
# 2) Leave featured_design_dir empty and fill featured_design_context below
#    with a description of what you want today's posts to highlight.
featured_design_dir: ""
featured_design_context: |
  A new modular cable management tray system. Snap-together segments that
  route under-desk cables along an aluminium extrusion. Designed for standing
  desks. Printed in PETG for heat resistance. Free STL on MakerWorld,
  paid version with extra mounts on Cults3D.

# Which platforms to generate content for. Comment out any you don't use yet.
platforms:
  - pinterest
  - instagram
  - twitter
  - tiktok

# Per-run quantities. Pinterest favors volume (5-15 pins/day). Instagram favors
# quality (1-2 posts/day). TikTok: 1/day is plenty for a brand account.
quantities:
  pinterest_pins: 8
  instagram_quotes: 1
  instagram_carousels: 1
  twitter_threads: 1
  tiktok_scripts: 1

# Visual style for generated graphics. Pick palettes that match your brand.
# Available: industrial, blueprint, midnight, neon, molten, lab, graphite, circuit
# Leave empty to let the tool rotate through all of them.
allowed_palettes:
  - industrial
  - blueprint
  - graphite
  - lab
